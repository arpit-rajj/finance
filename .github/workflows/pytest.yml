name: Finance App Test CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    # Define a postgres service container for Github Actions
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: arpitraj@020415
          POSTGRES_DB: finance_db # Main DB name if any tests unexpectedly hit it
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Pytest Test Suite
      # pytest-env reads from pytest.ini which maps to these same connection strings
      env:
        DATABASE_HOSTNAME: localhost
        DATABASE_PORT: 5432
        DATABASE_USERNAME: postgres
        DATABASE_PASSWORD: arpitraj@020415
        TEST_DATABASE_NAME: finance_test_db
        SECRET_KEY: test_secret_key_1234
        ALGORITHM: HS256
        ACCESS_TOKEN_EXPIRE_MINUTES: 30
        PYTHONPATH: .
      run: |
        python -m pytest app/tests streamlit_app/tests -v
